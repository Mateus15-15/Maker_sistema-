{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'style.css' %}">>
    <title>MAKER IFPI</title>
</head>
<body>
    <header class="cabecalho">
        <a href="index.html">
            <img src="IFPI Maker.jpeg" class="logo" alt="Logo IFPI Maker" height="100">
        </a>

        <nav class="menu">
            <a class="link ativo" href="inicio.html">Inicio</a>
            <a class="link" href="pag2.html">segunda página</a>
        </nav>
    </header>

    <main class="container">
        <form action="" method="get">
            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome" placeholder="Digite o nome do Aluno: " required>

            <label for="matricula">Matrícula</label>
            <input type="email" id="matricula" name="matricula" placeholder="Digite a matricula do aluno" required>

            <label for="senha">Senha</label>
            <input type="password">

            <button type="submit">Cadastrar Aluno</button>
        </form>     
        <a href="{% url 'cliente' %}">
            <button type="button">Ir para Cadastro de Cliente</button>
        </a>
    </main>
</body>
</html>
