<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Diretor</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Arial, Helvetica, sans-serif;
      background: #f1f4f8;
      color: #182230;
    }
    .container {
      width: 100%;
      max-width: 520px;
      background: #fff;
      border: 1px solid #e3e8ef;
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 12px 35px rgba(20, 35, 55, .08);
    }
    .topo { margin-bottom: 28px; }
    .identificador {
      display: inline-block;
      margin-bottom: 14px;
      padding: 6px 10px;
      border-radius: 20px;
      background: #eaf1ff;
      color: #2456a6;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .05em;
      text-transform: uppercase;
    }
    h1 { margin: 0 0 8px; font-size: 26px; }
    .descricao { margin: 0; color: #667085; font-size: 14px; line-height: 1.5; }
    .campo { margin-bottom: 20px; }
    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 700;
    }
    input {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #cfd6e0;
      border-radius: 9px;
      outline: none;
      font-size: 15px;
      transition: border-color .2s, box-shadow .2s;
    }
    input:focus {
      border-color: #356ac3;
      box-shadow: 0 0 0 3px rgba(53, 106, 195, .13);
    }
    input::placeholder { color: #98a2b3; }
    .ajuda { display: block; margin-top: 7px; color: #7a8494; font-size: 12px; }
    .botoes { display: flex; gap: 12px; margin-top: 28px; }
    button {
      flex: 1;
      padding: 13px 16px;
      border: 0;
      border-radius: 9px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }
    .limpar { background: #edf0f4; color: #344054; }
    .enviar { background: #2456a6; color: #fff; }
    button:hover { filter: brightness(.96); }
    .mensagem {
      display: none;
      margin-top: 18px;
      padding: 12px 14px;
      border-radius: 9px;
      background: #ecfdf3;
      color: #067647;
      font-size: 13px;
      line-height: 1.5;
    }
    .mensagem.visivel { display: block; }
    .rodape {
      margin: 22px 0 0;
      color: #98a2b3;
      font-size: 11px;
      text-align: center;
    }
    @media (max-width: 480px) {
      .container { padding: 24px 20px; }
      h1 { font-size: 23px; }
    }
  </style>
</head>
<body>
  <main class="container">
    <header class="topo">
      <span class="identificador">Sistema Maker</span>
      <h1>Cadastro de Diretor</h1>
      <p class="descricao">Preencha os campos abaixo com os dados do diretor.</p>
    </header>

    <form id="formDiretor">
      <div class="campo">
        <label for="nome">Nome completo</label>
        <input
          type="text"
          id="nome"
          name="nome"
          placeholder="Digite o nome completo"
          maxlength="100"
          autocomplete="name"
          required
        >
      </div>

      <div class="campo">
        <label for="email">E-mail</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="exemplo@email.com"
          maxlength="254"
          autocomplete="email"
          required
        >
      </div>

      <div class="campo">
        <label for="cpf">CPF</label>
        <input
          type="text"
          id="cpf"
          name="cpf"
          placeholder="000.000.000-00"
          inputmode="numeric"
          maxlength="14"
          autocomplete="off"
          aria-describedby="ajudaCpf"
          required
        >
        <small class="ajuda" id="ajudaCpf">Digite os 11 números do CPF.</small>
      </div>

      <div class="botoes">
        <button type="reset" class="limpar">Limpar</button>
        <button type="submit" class="enviar">Validar cadastro</button>
      </div>

      <div class="mensagem" id="mensagem" role="status" aria-live="polite"></div>
    </form>

    <p class="rodape">Demonstração de formulário — os dados não são armazenados.</p>
  </main>

  <script>
    const formulario = document.getElementById("formDiretor");
    const campoCpf = document.getElementById("cpf");
    const mensagem = document.getElementById("mensagem");

    // Formata o CPF enquanto a pessoa digita.
    campoCpf.addEventListener("input", function () {
      let numeros = this.value.replace(/\D/g, "").slice(0, 11);

      if (numeros.length > 9) {
        numeros = numeros.replace(/(\d{3})(\d{3})(\d{3})(\d{1,2})/, "$1.$2.$3-$4");
      } else if (numeros.length > 6) {
        numeros = numeros.replace(/(\d{3})(\d{3})(\d{1,3})/, "$1.$2.$3");
      } else if (numeros.length > 3) {
        numeros = numeros.replace(/(\d{3})(\d{1,3})/, "$1.$2");
      }

      this.value = numeros;
      this.setCustomValidity("");
      mensagem.classList.remove("visivel");
    });

    // Verifica os dígitos verificadores do CPF.
    function cpfValido(cpf) {
      const numeros = cpf.replace(/\D/g, "");

      if (numeros.length !== 11 || /^(\d)\1{10}$/.test(numeros)) {
        return false;
      }

      let soma = 0;
      for (let i = 0; i < 9; i++) {
        soma += Number(numeros[i]) * (10 - i);
      }
      let primeiroDigito = (soma * 10) % 11;
      if (primeiroDigito === 10) primeiroDigito = 0;
      if (primeiroDigito !== Number(numeros[9])) return false;

      soma = 0;
      for (let i = 0; i < 10; i++) {
        soma += Number(numeros[i]) * (11 - i);
      }
      let segundoDigito = (soma * 10) % 11;
      if (segundoDigito === 10) segundoDigito = 0;

      return segundoDigito === Number(numeros[10]);
    }

    formulario.addEventListener("reset", function () {
      mensagem.classList.remove("visivel");
      campoCpf.setCustomValidity("");
    });

    formulario.addEventListener("submit", function (evento) {
      evento.preventDefault();
      campoCpf.setCustomValidity("");

      if (!cpfValido(campoCpf.value)) {
        campoCpf.setCustomValidity("Digite um CPF válido.");
        campoCpf.reportValidity();
        return;
      }

      mensagem.textContent =
        "Validação concluída! Os campos foram preenchidos corretamente. " +
        "Este formulário é apenas uma demonstração: nenhum dado foi enviado ou salvo.";
      mensagem.classList.add("visivel");
    });
  </script>
</body>
</html>
