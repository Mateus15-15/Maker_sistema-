{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'style.css' %}">
    <title>MAKER IFPI</title>
</head>
<body>
    <header class="cabecalho">
        
            <img src="{% static 'img/Az4OY07a_400x400.png' %}" class="logo" alt="Logo IFPI Maker" height="100">
            
        <nav class="menu">
            <a class="link ativo" href="{% url 'index' %}">Inicio</a>
            <a class="link" href="{% url 'login' %}">Login</a>
        </nav>
    </header>

    <main class="container">
        <form action="" method="get">
            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome" placeholder="Digite seu nome de usuario " required>

            <label for="senha">Senha</label>
            <input type="password" id="senha" name="senha" placeholder="Digite Sua senha" required>

            <button type="submit">Cadastrar Aluno</button>
        </form>     
    </main>
</body>
</html>
